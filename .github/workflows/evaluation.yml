name: Core evaluation
on: [push, pull_request, workflow_dispatch]
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ./lab
      - run: python -m unittest discover -s evaluation/tests -v
      - run: python scripts/evaluate_system.py step1 --out evaluation/results/ci-step1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: step1-evidence
          path: evaluation/results/ci-step1
