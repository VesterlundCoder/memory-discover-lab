[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "westquant-memory-lab"
version = "0.6.1"
description = "Provenance-aware quantum memory discovery and network channel laboratory"
requires-python = ">=3.10"
dependencies = ["numpy>=2,<3", "scipy>=1.12,!=1.16.0,!=1.17.0,<2"]

[project.optional-dependencies]
quantum = ["qutip==5.3.1"]
chemistry = ["pyscf==2.14.0", "ase==3.29.0"]
spin = ["pycce==1.1.1", "pandas>=2.2,<3"]
propagation = ["maxwellbloch==0.12.0"]
datasets = ["openpyxl>=3.1,<4", "pynmrstar>=3.3,<4"]
network = ["sequence==1.2.0", "pandas>=2.3.3,<3"]
all = ["qutip==5.3.1", "pyscf==2.14.0", "ase==3.29.0", "pycce==1.1.1", "pandas>=2.2,<3",
       "maxwellbloch==0.12.0", "openpyxl>=3.1,<4", "pynmrstar>=3.3,<4",
       "sequence==1.2.0", "pandas>=2.3.3,<3"]

[project.scripts]
wqml = "memorylab.cli:main"

[tool.setuptools]
packages = ["memorylab"]
